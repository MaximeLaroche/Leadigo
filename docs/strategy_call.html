<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Call | Leadigo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://assets.calendly.com/assets/external/widget.js" async></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            overflow-x: hidden;
        }

        /* Gradient mesh background */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background:
                radial-gradient(circle at 15% 50%, rgba(37, 99, 235, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.08), transparent 25%);
            z-index: -1;
        }
    </style>
</head>
<body class="antialiased selection:bg-brand-500 selection:text-white">

    <div class="bg-mesh"></div>

    <main class="max-w-6xl mx-auto px-4 py-16 md:py-24">

        <div class="text-center max-w-3xl mx-auto mb-12">
            <span class="text-brand-400 font-semibold tracking-wider uppercase text-sm mb-4 block">Next Steps</span>
            <h1 class="text-4xl md:text-5xl font-bold mb-6">Book Your Free Strategy Call</h1>
            <p class="text-xl text-slate-300 font-light leading-relaxed">
                This call is to see if our cold outreach is a good fit for your company — and to get to know more about our cold outreach services. Zero obligation. Zero pressure.
            </p>
        </div>

        <!-- Calendly Embed -->
        <div class="bg-white rounded-2xl overflow-hidden shadow-2xl border border-slate-700 h-[700px]">
            <div class="calendly-inline-widget" data-url="https://calendly.com/maxime-leadigo/15min" style="min-width:320px;height:100%;"></div>
        </div>

    </main>

</body>
</html>
